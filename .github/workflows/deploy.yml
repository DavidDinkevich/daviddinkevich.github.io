name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml _site/
          cp -R static publications APEX apex _site/
          touch _site/.nojekyll

      - name: Check local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: ""
          fail: true
          lycheeVersion: v0.24.2
          args: --offline --root-dir '${{ github.workspace }}/_site' --verbose --no-progress '_site/**/*.html'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml _site/
          cp -R static publications APEX apex _site/
          touch _site/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: _site
